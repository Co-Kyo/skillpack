    <rect x="700" y="104" width="4" height="88" rx="2" fill="#185fa5"/>
    <text x="714" y="126" class="pkg-scope-b">@co-kyo/</text>
    <text x="714" y="144" class="pkg-name-b">skillpack-validate</text>
    <text x="714" y="168" class="pkg-sub-b">完整性校验 CLI</text>
    <text x="714" y="186" class="pkg-tag-b">depends on types, common</text>
  </g>

  <g>
    <rect x="700" y="220" width="220" height="88" rx="8" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.5"/>
    <rect x="700" y="220" width="4" height="88" rx="2" fill="#185fa5"/>
    <text x="714" y="242" class="pkg-scope-b">@co-kyo/</text>
    <text x="714" y="260" class="pkg-name-b">skillpack</text>
    <text x="714" y="284" class="pkg-sub-b">打包器 + Markdown 渲染 + CLI</text>
    <text x="714" y="302" class="pkg-tag-b">depends on types, common</text>
  </g>

  <path d="M300 188 L380 188" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 170 L700 148" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 215 L700 246" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M810 308 V398 H360 V434" fill="none" stroke="#185fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M560 398 V434" fill="none" stroke="#185fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="600" y="386" class="flow-label" fill="#185fa5">CLI 读取 config 与 skill</text>

  <text x="40" y="446" class="section">Layer 2 · Demo(demos/)</text>
  <line x1="40" y1="454" x2="960" y2="454" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <g>
    <rect x="240" y="466" width="240" height="76" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
    <rect x="240" y="466" width="4" height="76" rx="2" fill="#6b7280"/>
    <text x="254" y="492" class="demo-title">skillpack.config.ts</text>
    <text x="254" y="514" class="demo-sub">构建配置(defineConfig)</text>
    <text x="254" y="532" class="demo-tag">构建入口</text>
  </g>

  <g>
    <rect x="520" y="466" width="240" height="76" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
    <rect x="520" y="466" width="4" height="76" rx="2" fill="#6b7280"/>
    <text x="534" y="492" class="demo-title">skill.ts</text>
    <text x="534" y="514" class="demo-sub">技能定义(createSkill)</text>
    <text x="534" y="532" class="demo-tag">技能入口</text>
  </g>

  <path d="M480 504 L520 504" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M500 542 L500 594" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="572" class="flow-label">buildPipeline() 渲染</text>

  <text x="40" y="604" class="section">Layer 3 · Output(dist/)</text>
  <line x1="40" y1="612" x2="960" y2="612" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <g>
    <rect x="175" y="624" width="650" height="76" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.5"/>
    <rect x="175" y="624" width="4" height="76" rx="2" fill="#0f6e56"/>
    <text x="500" y="652" text-anchor="middle" class="dist-title">dist /</text>
    <text x="500" y="672" text-anchor="middle" class="dist-sub">构建产物</text>
    <text x="500" y="692" text-anchor="middle" class="dist-tag">SKILL.md  ·  processes/*.md  ·  3 份 manifest + align-report</text>
  </g>
</svg>
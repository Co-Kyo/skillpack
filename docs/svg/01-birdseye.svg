    <text x="94" y="166" class="pkg-scope">@co-kyo/</text>
    <text x="94" y="184" class="pkg-name">skillpack-types</text>
    <text x="94" y="208" class="pkg-sub">类型系统 + 构建函数</text>
    <text x="94" y="226" class="pkg-tag">leaf · zero deps</text>
  </g>

  <g>
    <rect x="380" y="144" width="220" height="88" rx="8" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.5"/>
    <rect x="380" y="144" width="4" height="88" rx="2" fill="#185fa5"/>
    <text x="394" y="166" class="pkg-scope-b">@co-kyo/</text>
    <text x="394" y="184" class="pkg-name-b">skillpack-common</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="auto" role="img" aria-labelledby="t d">
  <title id="t">skillpack · 全局鸟瞰图</title>
  <desc id="d">skillpack 物理目录结构:Framework 层四个 npm 包、Demo 层输入文件、Output 层构建产物及依赖与调用关系</desc>

  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif; }
    .title { font-size: 20px; font-weight: 500; fill: #1f2937; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .section { font-size: 13px; font-weight: 500; fill: #4b5563; }
    .pkg-scope { font-size: 12px; fill: #7f77dd; }
    .pkg-name { font-size: 14px; font-weight: 500; fill: #3c3489; }
    .pkg-scope-b { font-size: 12px; fill: #378add; }
    .pkg-name-b { font-size: 14px; font-weight: 500; fill: #0c447c; }
    .pkg-sub { font-size: 12px; fill: #534ab7; }
    .pkg-sub-b { font-size: 12px; fill: #185fa5; }
    .pkg-tag { font-size: 11px; fill: #7f77dd; }
    .pkg-tag-b { font-size: 11px; fill: #378add; }
    .demo-title { font-size: 14px; font-weight: 500; fill: #111827; }
    .demo-sub { font-size: 12px; fill: #4b5563; }
    .demo-tag { font-size: 11px; fill: #6b7280; }
    .dist-title { font-size: 16px; font-weight: 500; fill: #085041; }
    .dist-sub { font-size: 12px; fill: #0f6e56; }
    .dist-tag { font-size: 11px; fill: #1d9e75; }
    .note { font-size: 12px; fill: #6b7280; }
    .flow-label { font-size: 12px; font-weight: 500; fill: #4b5563; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" class="title">skillpack · 全局鸟瞰图</text>
  <text x="500" y="48" text-anchor="middle" class="subtitle">Skillpack Framework · 物理目录结构</text>

  <text x="40" y="82" class="section">Layer 1 · Framework(packages/)</text>
  <line x1="40" y1="92" x2="960" y2="92" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <g>
    <rect x="80" y="144" width="220" height="88" rx="8" fill="#eeedfe" stroke="#afae9c" stroke-width="0.5"/>

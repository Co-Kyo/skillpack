<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="100%" height="auto" role="img" aria-labelledby="t d">
  <title id="t">skillpack · 依赖拓扑图</title>
  <desc id="d">tsconfig 项目引用与 npm workspace 依赖关系:root 编排四包构建顺序,types 为基础层,common 中间层,build 与 validate 消费层,demo 依赖所有包</desc>

  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif; }
    .title { font-size: 20px; font-weight: 500; fill: #1f2937; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .section { font-size: 13px; font-weight: 500; fill: #4b5563; }
    .pkg-scope { font-size: 12px; fill: #7f77dd; }
    .pkg-name { font-size: 14px; font-weight: 500; fill: #3c3489; }
    .pkg-scope-b { font-size: 12px; fill: #378add; }
    .pkg-name-b { font-size: 14px; font-weight: 500; fill: #0c447c; }
    .pkg-dep { font-size: 11px; fill: #6b7280; }
    .pkg-exp-label { font-size: 11px; fill: #9ca3af; font-style: italic; }
    .pkg-exp { font-size: 11px; fill: #374151; }
    .demo-title { font-size: 14px; font-weight: 500; fill: #111827; }
    .demo-sub { font-size: 12px; fill: #4b5563; }
    .demo-tag { font-size: 11px; fill: #6b7280; }
    .legend-label { font-size: 11px; fill: #6b7280; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" class="title">skillpack · 依赖拓扑图</text>
  <text x="500" y="48" text-anchor="middle" class="subtitle">tsconfig 项目引用 + npm workspace 依赖 · 有向无环图</text>

  <line x1="80" y1="82" x2="120" y2="82" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="128" y="86" class="legend-label">tsconfig ref</text>
  <line x1="80" y1="104" x2="120" y2="104" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="128" y="108" class="legend-label">npm dep</text>

  <g>
    <rect x="350" y="64" width="300" height="64" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
    <rect x="350" y="64" width="4" height="64" rx="2" fill="#6b7280"/>
    <text x="500" y="88" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#111827">root tsconfig.json</text>
    <text x="500" y="110" text-anchor="middle" style="font-size:12px;fill:#4b5563">references 4 packages · 编排 tsc -b 构建顺序</text>
  </g>
  <text x="500" y="146" text-anchor="middle" style="font-size:11px;fill:#6b7280">tsconfig ref → types · common · build · validate</text>

  <g>
    <rect x="50" y="150" width="270" height="190" rx="8" fill="#eeedfe" stroke="#afae9c" stroke-width="0.5"/>
    <rect x="50" y="150" width="4" height="190" rx="2" fill="#534ab7"/>
    <text x="64" y="172" class="pkg-scope">@co-kyo/</text>
    <text x="64" y="190" class="pkg-name">skillpack-types</text>
    <line x1="64" y1="208" x2="304" y2="208" stroke="#e5e7eb" stroke-width="1"/>
